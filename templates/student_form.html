{% extends 'base.html' %}{% block page_heading %}Register Student{% endblock %}
{% block content %}<div class="form-wrap mt-4"><div class="card panel"><div class="card-body p-4"><span class="page-kicker">STUDENT REGISTRATION</span><h2 class="mb-4">Add New Student</h2>
<form method="post"><div class="row g-3">
<div class="col-md-6"><label>Roll Number *</label><input class="form-control" name="roll_no" required></div>
<div class="col-md-6"><label>Student Name *</label><input class="form-control" name="name" required></div>
<div class="col-md-6"><label>Email</label><input class="form-control" type="email" name="email"></div>
<div class="col-md-6"><label>Mobile</label><input class="form-control" name="mobile"></div>
<div class="col-md-6"><label>Department</label><input class="form-control" name="department"></div>
<div class="col-md-6"><label>Semester</label><input class="form-control" type="number" min="1" max="10" name="semester"></div>
</div><button class="btn btn-primary mt-4">Save Student</button> <a class="btn btn-light mt-4" href="{{url_for('students')}}">Cancel</a></form>
</div></div></div>{% endblock %}
