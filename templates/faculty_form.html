{% extends "base.html" %}{% block content %}<div class="container narrow"><div class="head"><h2>{% if faculty %}Edit Faculty{% else %}Add Faculty{% endif %}</h2><a class="btn" href="{{url_for('faculty_list')}}">Back</a></div><form method="post"><label>Faculty Name *</label><input name="faculty_name" required value="{{faculty.faculty_name if faculty else ''}}"><label>Email</label><input type="email" name="email" value="{{faculty.email if faculty else ''}}"><label>Mobile</label><input name="mobile" value="{{faculty.mobile if faculty else ''}}"><button class="btn primary" type="submit">{% if faculty %}Update Faculty{% else %}Save Faculty{% endif %}</button></form></div>{% endblock %}
