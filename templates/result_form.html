{% extends "base.html" %}{% block content %}<div class="container narrow"><div class="head"><div><h2>{% if result %}Edit Academic Result{% else %}Add Academic Result{% endif %}</h2><p>Student: <b>{{student.name}}</b> ({{student.roll_no}})</p></div><a class="btn" href="{{url_for('results')}}">Back</a></div><form method="post"><label>Semester *</label><input type="number" name="semester" min="1" max="20" required value="{{result.semester if result else student.semester or ''}}"><label>Total Marks</label><input type="number" name="total_marks" min="0" step="0.01" value="{{result.total_marks if result else ''}}"><label>Percentage *</label><input type="number" name="percentage" min="0" max="100" step="0.01" required value="{{result.percentage if result else ''}}"><label>Grade</label><input name="grade" maxlength="5" placeholder="A / B / C / D / F" value="{{result.grade if result else ''}}"><label>Result Status *</label><select name="result_status" required><option value="">Select Result</option><option value="Pass" {% if result and result.result_status=='Pass' %}selected{% endif %}>Pass</option><option value="Fail" {% if result and result.result_status=='Fail' %}selected{% endif %}>Fail</option></select><button class="btn primary" type="submit">{% if result %}Update Result{% else %}Save Result{% endif %}</button></form></div>{% endblock %}
